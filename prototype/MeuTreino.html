<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MeuTreino — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #0a0b0d;
    --bg-app: #0d0e12;
    --surface-1: #14161c;
    --surface-2: #1a1d25;
    --surface-3: #232631;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.62);
    --muted-2: rgba(255,255,255,0.38);
    --muted-3: rgba(255,255,255,0.18);
    --accent: #CCFF00;
    --accent-ink: #0a0b0d;
    --accent-glow: 204, 255, 0;
    --danger: #ff4f5e;
    --warn: #ffb547;
    --ok: #6dffb0;
    --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
    --font-body: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html, body {
    margin: 0; padding: 0;
    background: #060608;
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body {
    background:
      radial-gradient(circle at 20% 0%, rgba(var(--accent-glow), 0.06), transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(var(--accent-glow), 0.04), transparent 50%),
      #060608;
  }
  #stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 48px;
    flex-wrap: wrap;
  }
  .side-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: rgba(255,255,255,0.32);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    max-width: 240px;
    line-height: 1.6;
  }
  .side-label b { color: rgba(255,255,255,0.7); font-weight: 600; }
  .side-label .accent { color: var(--accent); }

  /* placeholder while React boots */
  .booting {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    color: var(--muted);
    font-family: var(--font-mono); font-size: 12px;
    letter-spacing: 0.2em;
  }

  /* hide native scrollbars inside the phone */
  .app-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .app-scroll { scrollbar-width: none; }

  /* tap state */
  .tappable { cursor: pointer; transition: transform 80ms ease, opacity 120ms ease, background 120ms ease; }
  .tappable:active { transform: scale(0.97); }

  /* shared keyframes */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slide-up {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes scale-in {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="side-label">
      <span class="accent">/// MEUTREINO</span><br/>
      protótipo interativo · mobile<br/>
      navegue pela barra inferior · toque nos exercícios · marque séries como concluídas · abra vídeos<br/><br/>
      <b>tweaks</b> no canto inferior direito ajustam cor de destaque, tema e player de vídeo.
    </div>
    <div id="root">
      <div class="booting">CARREGANDO…</div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/ios-frame.jsx"></script>
  <script type="text/babel" src="src/tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/ui.jsx"></script>
  <script type="text/babel" src="src/charts.jsx"></script>
  <script type="text/babel" src="src/modals.jsx"></script>
  <script type="text/babel" src="src/screen-dashboard.jsx"></script>
  <script type="text/babel" src="src/screen-treino.jsx"></script>
  <script type="text/babel" src="src/screen-progresso.jsx"></script>
  <script type="text/babel" src="src/screen-corpo.jsx"></script>
  <script type="text/babel" src="src/screen-historico.jsx"></script>
  <script type="text/babel" src="src/screen-dieta.jsx"></script>
  <script type="text/babel" src="src/screen-perfil.jsx"></script>
  <script type="text/babel" src="src/screen-notificacoes.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
